<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><title>Radar UDI</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui}.wrap{max-width:1050px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:18px;padding:20px}.card{background:#fff;border-radius:15px;padding:15px;margin:13px 0;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}label{font-size:12px;font-weight:700;color:#596574;display:block;margin-bottom:5px}input,select,button{width:100%;min-height:44px;padding:9px;border-radius:9px;border:1px solid #d6dce3;font-size:15px}button{background:#111827;color:white;font-weight:700}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{background:#f7f8fa;border-radius:11px;padding:13px}.big{font-size:22px;font-weight:850}.muted{color:#687582;font-size:13px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}.alert{padding:11px;background:#fff4cf;border-left:4px solid #d39b00;border-radius:8px}</style></head><body><div class="wrap"><div class="hero"><h1>✈️ Radar UDI</h1><div>REC • MCZ • JPA → UDI | 20–22/12/2026</div><div id="server" class="muted">Conectando...</div></div><div class="card"><div class="grid"><div><label>Preço para alerta</label><input id="price" type="number" value="800"></div><div><label>Atualização</label><select id="interval"><option value="30">30 minutos</option><option value="60">60 minutos</option></select></div><div><label>Passageiros</label><input value="1 adulto" disabled></div><button id="save">Salvar</button></div><p><button id="run">🔄 Consultar agora</button></p></div><div class="card"><div class="stats"><div class="stat"><div class="muted">Menor tarifa</div><div class="big" id="best">—</div></div><div class="stat"><div class="muted">Companhia</div><div class="big" id="airline">—</div></div><div class="stat"><div class="muted">Rota/data</div><div class="big" id="route">—</div></div></div></div><div class="card"><div id="alert"></div><div class="scroll"><table><thead><tr><th>Origem</th><th>Data</th><th>Companhia</th><th>Preço</th><th>Conexões</th><th>Partida</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><div id="status" class="muted">—</div></div></div><script>
const $=x=>document.getElementById(x);function render(d){let a=(d.results||[]).filter(x=>x.price>0).sort((x,y)=>x.price-y.price),b=a[0];if(b){$("best").textContent="R$ "+b.price.toLocaleString("pt-BR",{minimumFractionDigits:2});$("airline").textContent=b.airline;$("route").textContent=`${b.origin} → UDI • ${b.date.slice(8)}/12`}$("rows").innerHTML=a.slice(0,100).map(x=>`<tr><td>${x.origin}</td><td>${x.date.split("-").reverse().join("/")}</td><td>${x.airline}</td><td>R$ ${x.price.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td>${x.stops}</td><td>${x.departure||"—"}</td></tr>`).join("");let p=Number($("price").value)||d.priceAlert||800;$("alert").innerHTML=b&&b.price<=p?`<div class="alert">🚨 <b>ALERTA:</b> ${b.airline} ${b.origin} → UDI por <b>R$ ${b.price.toLocaleString("pt-BR",{minimumFractionDigits:2})}</b>.</div>`:"";$("status").textContent=`Última consulta: ${d.lastRun?new Date(d.lastRun).toLocaleString("pt-BR"):"—"} • ${a.length} ofertas.`}
async function load(){let d=await(await fetch("/api/results")).json();render(d);let s=await(await fetch("/api/status")).json();$("interval").value=s.intervalMinutes;$("price").value=s.priceAlert;$("server").textContent=s.running?`🟢 Radar ativo • a cada ${s.intervalMinutes} min`:"🔴 Radar parado"}$("run").onclick=async()=>render(await(await fetch("/api/run",{method:"POST"})).json());$("save").onclick=async()=>{let d=await(await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({intervalMinutes:Number($("interval").value),priceAlert:Number($("price").value)})})).json();$("server").textContent=`🟢 Radar configurado para ${d.intervalMinutes} min`};load();setInterval(load,60000);
</script></body></html>
